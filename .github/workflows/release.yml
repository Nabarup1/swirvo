name: release

# Push a version tag (for example `git tag v0.1.0 && git push origin v0.1.0`) to build the
# Windows and Linux downloads and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, for example v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p swirvo-platform-win -p swirvo-cli
      - name: Fetch every dependency (the licence notices read them offline)
        run: cargo fetch --locked
      - name: Package
        run: |
          out="Swirvo-${TAG#v}-windows-x64"
          mkdir -p "$out"
          cp target/release/swirvo-agent.exe "$out/Swirvo.exe"
          cp target/release/swirvo.exe "$out/swirvo-cli.exe"
          python -I scripts/third-party-notices.py "$out/THIRD-PARTY-NOTICES.txt" --target x86_64-pc-windows-msvc
          cp "packaging/windows/How to use.txt" EULA.md PRIVACY.md "$out/"
          7z a -tzip "$out.zip" "$out" > /dev/null
          sha256sum "$out.zip" > "$out.zip.sha256"
          # The Claude Desktop extension: the CLI as an MCP server, one-click install.
          ext="Swirvo-${TAG#v}.mcpb"
          mkdir -p mcpb/server
          cp "$out/swirvo-cli.exe" mcpb/server/
          cp "$out/THIRD-PARTY-NOTICES.txt" EULA.md PRIVACY.md mcpb/
          cp packaging/icon/png/swirvo-256.png mcpb/icon.png
          sed "s/@VERSION@/${TAG#v}/" packaging/mcpb/manifest.json > mcpb/manifest.json
          (cd mcpb && 7z a -tzip "../$ext" . > /dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Swirvo-*-windows-x64.zip*
            Swirvo-*.mcpb

  linux:
    # Built against glibc 2.28 with Zig as the linker, so one binary runs on Ubuntu 18.10+,
    # Debian 10+, RHEL/Rocky/Alma 8+, Fedora, Mint 20+ and most other distributions.
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Install Zig and cargo-zigbuild
        run: python3 -m pip install --user --break-system-packages ziglang==0.17.1 cargo-zigbuild==0.24.1
      - name: Build (glibc 2.28)
        run: cargo zigbuild --release --locked -p swirvo-cli --target ${{ matrix.target }}.2.28
      - name: Fetch every dependency (the licence notices read them offline)
        run: cargo fetch --locked
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/swirvo"
          strip "$bin"
          python3 -I scripts/third-party-notices.py notices.txt --target ${{ matrix.target }}
          scripts/package-linux.sh "$bin" "${TAG#v}" ${{ matrix.arch }} notices.txt out
      - name: Smoke test on Debian 10 (glibc 2.28)
        run: |
          docker run --rm -v "$PWD/out:/out" debian:10 sh -ec '
            cd /tmp && tar -xzf /out/swirvo-cli-*-linux-${{ matrix.arch }}.tar.gz
            bin=$(echo swirvo-cli-*/swirvo)
            $bin --version
            printf "a,b\n1,2\n" > t.csv
            $bin convert t.csv --to json
            test -s t.json
            echo "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}" | $bin mcp | grep -q convert_files'
      - name: Smoke test the .deb on Ubuntu 20.04
        run: |
          docker run --rm -v "$PWD/out:/out" ubuntu:20.04 sh -ec '
            apt-get install -y /out/swirvo_*.deb > /dev/null
            swirvo --version'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release notes
        run: |
          python3 - <<'PY' > notes.md
          import os, re
          tag = os.environ["TAG"].lstrip("v")
          log = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[?" + re.escape(tag) + r"\b.*?$(.*?)(?=^## |\Z)", log, re.S | re.M)
          print(m.group(1).strip() if m else "")
          print()
          print(open(".github/release-footer.md", encoding="utf-8").read())
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Swirvo ${{ env.TAG }}
          body_path: notes.md
          files: assets/*
          fail_on_unmatched_files: true

  mcp-registry:
    needs: publish
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
