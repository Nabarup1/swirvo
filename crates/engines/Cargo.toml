[package]
name = "swirvo-engines"
description = "Built-in conversion engines (Core pack): pure Rust, no native libraries required."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
swirvo-core.workspace = true
image.workspace = true
flate2.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
toml.workspace = true
csv.workspace = true
calamine.workspace = true
rust_xlsxwriter.workspace = true
pulldown-cmark.workspace = true
encoding_rs.workspace = true
tar.workspace = true
zip.workspace = true
zstd = { workspace = true, optional = true }
quick-xml.workspace = true
scraper.workspace = true
ego-tree.workspace = true
lopdf.workspace = true
getrandom.workspace = true
krilla.workspace = true
hayro.workspace = true
resvg.workspace = true
jxl-oxide.workspace = true
symphonia.workspace = true
hound.workspace = true
flacenc.workspace = true
bzip2.workspace = true
lzma-rust2.workspace = true
brotli.workspace = true
ab_glyph.workspace = true
rustybuzz.workspace = true
fontdb.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Ocr",
    "Win32_Media_MediaFoundation",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[features]
default = ["zstd"]
# Needs a C compiler (zstd-sys). Disable to cross-check from Linux without MSVC.
zstd = ["dep:zstd"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
