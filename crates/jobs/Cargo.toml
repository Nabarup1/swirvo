[package]
name = "swirvo-jobs"
description = "Plans and runs conversions: naming, atomic no-replace commit, parallel batches, frecency."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
swirvo-core.workspace = true
swirvo-formats.workspace = true
swirvo-graph.workspace = true
swirvo-wheel.workspace = true
swirvo-engines.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
sha2.workspace = true
image.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[features]
default = ["zstd"]
zstd = ["swirvo-engines/zstd"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
